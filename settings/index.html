<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>YoLink Settings</title>
	<link rel="stylesheet" type="text/css" href="lwsa.css">
	<link rel="stylesheet" type="text/css" href="busy_indicator.css" />
	<link rel="stylesheet" type="text/css" href="extraStyles.css">
	<link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>

	<style type="text/css">
		.fog_div {
			display: none;
			position: fixed;
			top: 0px;
			left: 0px;
			height: 100%;
			width: 100%;
			z-index: 100;
			background-color: rgba(30, 30, 30, 0.5);
		}

		#busybox.show {
			display: block;
		}

		.is-hidden {
			display: none;
		}

		#simData {
			white-space: nowrap;
		}

		.sim-activate {
			background-color: #0f9e16;
			color: white;
			margin: 5px 20px 5px 5px;
		}

		.sim-clear {
			background-color: #a5510d;
			color: white;
			margin: 5px 20px 5px 5px;
		}

		.login-panel-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(20, 20, 20, 0.6);
			z-index: 150;
		}

		.login-panel {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: min(92vw, 460px);
			background: #fff;
			border-radius: 12px;
			padding: 18px;
			box-shadow: 0 14px 28px rgba(0, 0, 0, 0.2);
		}

		.login-panel-title {
			margin: 0 0 8px;
			font-size: 1.15rem;
		}

		.login-panel-help {
			margin: 0 0 14px;
			color: #5f5f5f;
			font-size: 0.92rem;
		}

		.login-panel-actions {
			display: flex;
			justify-content: flex-end;
			gap: 8px;
			margin-top: 12px;
		}
	</style>

	<!-- The '/homey.js' script must be included in your settings view to work -->
	<script type="text/javascript" src="/homey.js" data-origin="settings"></script>
	<script type="text/javascript" src="busy_indicator.js"></script>
</head>

<body>
	<!-- Busy indicator -->
	<div id="busybox" class="fog_div">
		<div></div>
	</div>

	<div id="loginPanelOverlay" class="login-panel-overlay" role="dialog" aria-modal="true" aria-labelledby="loginPanelTitle">
		<div class="login-panel">
			<h2 id="loginPanelTitle" class="login-panel-title" data-i18n="settings.loginPanelTitle">Log in to YoLink</h2>
			<p class="login-panel-help" data-i18n="settings.loginPanelHelp">Enter your UAID and Secret Key from the YoLink app to retrieve devices.</p>
			<div class="field row">
				<label class="homey-form-label" for="loginUAID" data-i18n="settings.loginPanelUAID">UAID</label>
				<input class="homey-form-input" id="loginUAID" type="text" value="" aria-label="UAID" />
				<label class="homey-form-label" for="loginSecret" data-i18n="settings.loginPanelSecretKey">Secret Key</label>
				<input class="homey-form-input" id="loginSecret" type="password" value="" aria-label="Secret Key" />
			</div>
			<div class="login-panel-actions">
				<button id="cancelLoginPanel" class="homey-button-secondary" data-i18n="settings.loginPanelCancel">Cancel</button>
				<button id="submitLoginPanel" class="homey-button-primary" data-i18n="settings.loginPanelSubmit">Log in</button>
			</div>
		</div>
	</div>

	<!-- Tab links -->
	<div class="tab">
		<button class="tablinks" onclick="setPage(event, 'detected')" id="defaultOpen">Detected</button>
		<button class="tablinks" onclick="setPage(event, 'log')">Log</button>
		<button class="tablinks is-hidden" onclick="setPage(event, 'simulator')" id="simLogTab">Simulation Data</button>
	</div>

	<!-- detected-->
	<div id="detected" class="tabcontent">
		<fieldset>
			<p>
				<button id="getDeviceLog" class="homey-button-small" data-i18n="settings.getDevices" aria-label="Get devices" title="Get devices">Get devices</button>
				<button id="clearDeviceLog" class="homey-button-small" data-i18n="settings.clear" aria-label="Clear devices" title="Clear devices">Clear</button>
				<button id="sendDeviceLog" class="homey-button-small" data-i18n="settings.send" aria-label="Send device log" title="Send device log">Send</button>
			</p>
			<div class="field row">
				<label class="homey-form-label" for="detectedDevices">Detected devices</label>
				<textarea id="detectedDevices" class="homey-form-textarea" wrap="off" aria-label="Detected devices"></textarea>
			</div>
		</fieldset>
	</div>

	<!-- LOG PAGE -->
	<div id="log" class="tabcontent">
		<fieldset class="homey-form-fieldset">
			<label class="homey-form-checkbox">
				<input class="homey-form-checkbox-input" id="enableLog" type="checkbox" value="auto" aria-label="Enable logging" title="Enable logging" />
				<span class="homey-form-checkbox-checkmark"></span>
				<span class="homey-form-checkbox-text"><span data-i18n="settings.enableLog"></span></span>
				<div class="tooltip"><i class="fi fi-rr-info"></i>
					<span class="tooltiptext" data-i18n="settings.enableLLogExplanation"></span>
				</div>
			</label>
			<div class="field row">
				<label class="homey-form-label" for="email"><span data-i18n="settings.email"></span>
					<div class="tooltip"><i class="fi fi-rr-info"></i>
						<span class="tooltiptext" data-i18n="settings.emailExplanation"></span>
					</div>
				</label>
				<input class="homey-form-input" id="email" type="text" value="" aria-label="Email address" />
				<label class="homey-form-label" for="description"><span data-i18n="settings.description"></span>
					<div class="tooltip"><i class="fi fi-rr-info"></i>
						<span class="tooltiptext" data-i18n="settings.descriptionExplanation"></span>
					</div>
				</label>
				<input class="homey-form-input" id="description" type="text" value="" aria-label="Description" />
				<p></p>
			</div>
			<p>
				<button id="clearInfoLog" class="homey-button-small" data-i18n="settings.clear" aria-label="Clear log" title="Clear log">Clear</button>
				<button id="sendInfoLog" class="homey-button-small" data-i18n="settings.send" aria-label="Send log" title="Send log">Send</button>
			</p>
			<div class="field row">
				<label class="homey-form-label" for="infoLog">Information log</label>
				<textarea id="infoLog" class="homey-form-textarea" wrap="off" aria-label="Information log"></textarea>
			</div>
		</fieldset>
	</div>

	<!--SIMULATION PAGE -->
	<div id="simulator" class="tabcontent">
		<fieldset class="homey-form-fieldset">
			<h1>For debug use only</h1>
			<p><button id="useSim" class="sim-activate" aria-label="Activate simulator">Activate</button><button id="clearSim" class="sim-clear" aria-label="Clear simulator">Clear Sim</button></p>
			<div class="field row">
				<label class="homey-form-label" for="simData">Simulator data</label>
				<textarea id="simData" aria-label="Simulator data"></textarea>
			</div>
		</fieldset>
	</div>

	<script type="text/javascript">
		// Create the busy indicator
		var busyi;
		busyi = new busy_indicator(document.getElementById("busybox"), document.querySelector("#busybox div"));

		var detectedDevicesElement = document.getElementById('detectedDevices');
		var infoLogElement = document.getElementById('infoLog');
		var logEnabledElement = document.getElementById('enableLog');
		var clearInfoLogElement = document.getElementById('clearInfoLog');
		var sendInfoLogElement = document.getElementById('sendInfoLog');

		var getDeviceLogElement = document.getElementById('getDeviceLog');
		var clearDeviceLogElement = document.getElementById('clearDeviceLog');
		var sendDeviceLogElement = document.getElementById('sendDeviceLog');
		var emailElement = document.getElementById('email');
		var descriptionElement = document.getElementById('description');

		// Simulation log tab
		var useSimElement = document.getElementById('useSim');
		var clearSimElement = document.getElementById('clearSim');
		var simDataElement = document.getElementById('simData');

		var loginPanelOverlayElement = document.getElementById('loginPanelOverlay');
		var loginUAIDElement = document.getElementById('loginUAID');
		var loginSecretElement = document.getElementById('loginSecret');
		var submitLoginPanelElement = document.getElementById('submitLoginPanel');
		var cancelLoginPanelElement = document.getElementById('cancelLoginPanel');

		function setLoginPanelVisible(isVisible)
		{
			loginPanelOverlayElement.style.display = isVisible ? 'block' : 'none';
			if (isVisible)
			{
				loginUAIDElement.focus();
			}
		}

		function fetchDetectedDevices()
		{
			waitCursor(true);
			Homey.api('GET', '/getDeviceLog/',
				{
					hubDevices: true
				}, function (err, result)
			{
				if (err)
				{
					Homey.alert(err);
				}
				else
				{
					detectedDevicesElement.value = result;
				}
				waitCursor(false);
			});
		}

		function loginAndFetchDevices()
		{
			const UAID = typeof loginUAIDElement.value === 'string' ? loginUAIDElement.value.trim() : '';
			const secretKey = typeof loginSecretElement.value === 'string' ? loginSecretElement.value.trim() : '';

			if (!UAID || !secretKey)
			{
				return Homey.alert(Homey.__('settings.loginPanelMissingCredentials'));
			}

			waitCursor(true);
			Homey.api('POST', '/loginYoLink/',
				{
					UAID,
					secretKey,
				}, function (err)
			{
				if (err)
				{
					waitCursor(false);
					return Homey.alert(err);
				}

				setLoginPanelVisible(false);
				waitCursor(false);
				fetchDetectedDevices();
			});
		}

		function ensureLoggedInAndFetchDevices()
		{
			Homey.api('GET', '/isYoLinkLoggedIn/', {}, function (err, result)
			{
				if (err)
				{
					return Homey.alert(err);
				}

				if (result && result.loggedIn)
				{
					fetchDetectedDevices();
				}
				else
				{
					setLoginPanelVisible(true);
				}
			});
		}

		// a method named 'onHomeyReady' must be present in your code
		function onHomeyReady(Homey)
		{
			Homey.get('debugMode', function (err, debugMode)
			{
				if (err) return Homey.alert(err);
				if (debugMode)
				{
					document.getElementById("simLogTab").style.display = 'block';
				}
			});

			// Tell Homey we're ready to be displayed
			Homey.ready();

			document.getElementById("defaultOpen").click();

			Homey.api('GET', '/getInfoLog/',
				{
					notify: true
				}, function (err, result)
			{
				if (err)
				{
					Homey.alert(err);
				}
				else
				{
					infoLogElement.value = result;
				}
			});

			Homey.on('com.yolink.logupdated', function (data)
			{
				infoLogElement.value = data.log;
			});

			Homey.get('logEnabled', function (err, logEnabled)
			{
				if (err) return Homey.alert(err);
				logEnabledElement.checked = logEnabled;
			});

			logEnabledElement.addEventListener('change', function (e)
			{
				Homey.set('logEnabled', logEnabledElement.checked, function (err)
				{
					if (err) return Homey.alert(err);
				});
			});

			getDeviceLogElement.addEventListener('click', function ()
			{
				ensureLoggedInAndFetchDevices();
			});

			submitLoginPanelElement.addEventListener('click', function ()
			{
				loginAndFetchDevices();
			});

			cancelLoginPanelElement.addEventListener('click', function ()
			{
				setLoginPanelVisible(false);
			});

			loginPanelOverlayElement.addEventListener('click', function (event)
			{
				if (event.target === loginPanelOverlayElement)
				{
					setLoginPanelVisible(false);
				}
			});

			loginSecretElement.addEventListener('keydown', function (event)
			{
				if (event.key === 'Enter')
				{
					event.preventDefault();
					loginAndFetchDevices();
				}
			});

			clearDeviceLogElement.addEventListener('click', function (e)
			{
				Homey.set('deviceLog', "", function (err)
				{
					if (err) return Homey.alert(err);
				});
				detectedDevicesElement.value = "";
			});

			sendDeviceLogElement.addEventListener('click', function (e)
			{
				if (detectedDevicesElement.value.length < 15)
				{
					return Homey.alert(Homey.__("settings.descriptionExplanation"));
				}
				Homey.confirm(Homey.__("settings.sendLogConfirm"), null, function (e, ok)
				{
					if (ok)
					{
						waitCursor(true);
						Homey.api('POST', '/SendDeviceLog/',
							{
								notify: true,
								email: emailElement.value,
								description: descriptionElement.value,
								log: detectedDevicesElement.value,
							}, function (err, result)
						{
							if (err)
							{
								Homey.alert(err);
							}
							else
							{
								Homey.alert("Log sent successfully");
							}
							waitCursor(false);
						});
					}
				});
			});

			sendInfoLogElement.addEventListener('click', function (e)
			{
				if (infoLogElement.value.length < 15)
				{
					return Homey.alert("No Data to send");
				}

				Homey.confirm("Send the information log contents to the developer?", null, function (e, ok)
				{
					if (ok)
					{
						waitCursor(true);
						Homey.api('POST', '/sendInfoLog/',
							{
								notify: true,
								email: emailElement.value,
								description: descriptionElement.value,
								log: infoLogElement.value,
							}, function (err, result)
						{
							if (err)
							{
								Homey.alert(err);
							}
							else
							{
								Homey.alert("Log sent successfully");
							}
							waitCursor(false);
						});
					}
				});
			});

			clearInfoLogElement.addEventListener('click', function (e)
			{
				Homey.api('POST', '/clearLog/',
					{
						notify: true
					}, function (err, result)
				{
					if (err)
					{
						return Homey.alert(err);
					}
					else
					{
						infoLogElement.value = "";
					}
				});
			});


			logEnabledElement.addEventListener('click', function (e)
			{
				Homey.set('logEnabled', logEnabledElement.checked);
			});

			var tooltips = document.querySelectorAll(".tooltip");
			tooltips.forEach(function (tooltip, index)
			{
				// Set a mouse over function for each tooltop element
				tooltip.addEventListener("mouseover", position_tooltip); // On hover, launch the function below
			})

			useSimElement.addEventListener('click', function (e)
			{
				try
				{
					Homey.set('simData', JSON.parse(simDataElement.value), function (err)
					{
						if (err)
						{
							Homey.alert(err);
						}
						else
						{
							Homey.alert("Simulator On");
						}
					});
				}
				catch (err)
				{
					return Homey.alert(err);
				}
			});

			clearSimElement.addEventListener('click', function (e)
			{
				Homey.unset('simData', function (err)
				{
					if (err)
					{
						return Homey.alert(err);
					}
					else
					{
						return Homey.alert("Simulator Off");
					}
				});
			});
		}

		function setPage(evt, tabPage)
		{
			var i, tabcontent, tablinks;

			// Get all elements with class="tabcontent" and hide them
			tabcontent = document.getElementsByClassName("tabcontent");
			for (i = 0; i < tabcontent.length; i++)
			{
				tabcontent[i].style.display = "none";
			}

			// Get all elements with class="tablinks" and remove the class "active"
			tablinks = document.getElementsByClassName("tablinks");
			for (i = 0; i < tablinks.length; i++)
			{
				tablinks[i].className = tablinks[i].className.replace(" active", "");
			}

			// Show the current tab, and add an "active" class to the button that opened the tab
			document.getElementById(tabPage).style.display = "block";
			evt.currentTarget.className += " active";

			if (tabPage == 'log')
			{
				// Refresh the log data
				Homey.get('logEnabled', function (err, logEnabled)
				{
					if (err) return Homey.alert(err);
					logEnabledElement.checked = logEnabled;
				});

				// Make the log text area fill the page
				infoLogElement.setAttribute('cols', infoLogElement.parentElement.clientWidth / 8);
				infoLogElement.style.height = (window.innerHeight - infoLogElement.offsetTop - 60) + 'px';
			}
			else if (tabPage == 'detected')
			{
				// Make the detected devices text area fill the page
				detectedDevicesElement.setAttribute('cols', detectedDevicesElement.parentElement.clientWidth / 8);
				detectedDevicesElement.style.height = (window.innerHeight - detectedDevicesElement.offsetTop - 60) + 'px';
			}
			else if (tabPage == 'simulator')
			{
				Homey.get('simData', function (err, simData)
				{
					if (err) return Homey.alert(err);
					simDataElement.value = simData ? JSON.stringify(simData, null, 2) : "";
				});
				// Make the simulator text box fill the page
				simDataElement.setAttribute('cols', simDataElement.parentElement.clientWidth / 8);
				simDataElement.style.height = (window.innerHeight - simDataElement.offsetTop - 60) + 'px';
			}
		}

		function position_tooltip()
		{
			// Get .tooltiptext sibling
			var tooltip = this.parentNode.querySelector(".tooltiptext");

			// Get tooltip coordinates and size
			var tooltip_rect = tooltip.getBoundingClientRect();

			// Corrections if out of window
			var maxRight = window.innerWidth - 50;
			var tipRight = tooltip_rect.x + tooltip_rect.width;

			if (tipRight > maxRight)
			{
				tipX = maxRight - tipRight;

				// Apply corrected position
				if (tooltip.style.left === "")
				{
					tooltip.style.left = tipX + 'px';
				}
				else
				{
					tooltip.style.left -= tipX + 'px';
				}
			}
		}


		function waitCursor(On)
		{
			if (On)
			{
				busyi.show();
			}
			else
			{
				busyi.hide();
			}
		}
	</script>

</body>

</html>
